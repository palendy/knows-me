[package]
name = "knows-me"
version = "0.1.0"
edition = "2021"
description = "knows-me desktop app — Tauri 2 shell over the knows-me-core (U1) library"
license = "MIT"

# Standalone crate (not part of the core's build) so the core library stays fast
# to build/test without the platform webview toolchain. Requires Tauri's system
# dependencies (webview2 / webkit2gtk) to build — see README.md.

[[bin]]
name = "knows-me"
path = "src/main.rs"

[features]
# The Notion connector is ON by default: `tauri dev` / a plain release build
# both talk to the real Notion API, so a stored token immediately reports its
# reachable-page count and collects pages. Build with `--no-default-features`
# to get the offline skeleton (used by the core's offline tests).
default = ["notion-http"]
# Forward the core's real cloud LLM client (+ the Notion connector, which it
# needs anyway). Off by default so the app runs offline for the LLM (canned
# client); turn on with `--features llm-http`.
llm-http = ["knows-me-core/llm-http", "knows-me-core/notion-http"]
# The real Notion connector (Notion HTTP API). Enabled via `default` above.
notion-http = ["knows-me-core/notion-http"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
knows-me-core = { path = "../src-tauri" }
tauri = { version = "2", features = [] }
# Open external links (the connect dialogs' "how to get a token" links) in the
# owner's default browser. A bare <a target="_blank"> does nothing inside the
# Tauri webview; this plugin bridges to the OS opener.
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
# Command return types that are shaped here rather than in the core (e.g. the
# ingest summary that merges an IngestReport with a ProcessReport).
serde = { version = "1", features = ["derive"] }
# The connect_source command receives a source-specific field map as free JSON,
# and the persona chat history is stored as JSON in the encrypted vault.
serde_json = "1"
# Loads a local `.env` on startup so the LLM model/key are read without
# manually exporting env vars. Not optional: the default (CLI) backend reads
# the environment too, so gating this on `llm-http` made `.env` a no-op in the
# build most owners actually run.
dotenvy = "0.15"
