[package]
name = "knows-me-core"
version = "0.1.0"
edition = "2021"
description = "knows-me — U1 Core Platform & Security: shared contracts (types, service traits) + mocks (Milestone 0)"
license = "MIT"

# U1 Milestone 0 delivers the shared contract layer as a library so U2/U3/U4 can
# develop in parallel against traits + mocks. The Tauri application binary and the
# real service implementations are added during U1 full implementation.
[lib]
name = "knows_me_core"
path = "src/lib.rs"

[[bin]]
name = "knows-me-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
