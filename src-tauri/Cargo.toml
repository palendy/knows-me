[package]
name = "knows-me-core"
version = "0.1.0"
edition = "2021"
description = "knows-me — U1 Core Platform & Security: shared contracts + real security (KDF + AES-256-GCM vault), masking gateway, and LLM client"
license = "MIT"

# U1 owns the shared contract layer AND the platform/security core. This crate is
# a pure library (no Tauri dependency) so it builds and is fully unit/property
# tested on any toolchain. The Tauri desktop shell lives in the sibling `desktop/`
# crate (path-depends on this one); the React frontend lives in `../src/`.
[lib]
name = "knows_me_core"
path = "src/lib.rs"

# Headless demo binary: runs a real onboarding → unlock → encrypt → store →
# mask round-trip end-to-end (no GUI required), so U1 is demonstrable from a
# terminal. `cargo run` prints each step.
[[bin]]
name = "knows-me-demo"
path = "src/main.rs"

[features]
default = []
# Enables the real cloud LLM client (Anthropic Messages API over HTTPS). Off by
# default so the core builds/tests fully offline; the canned client is used
# otherwise. Turn on with `--features llm-http`.
llm-http = ["dep:reqwest"]
# Enables the real Notion connector (Notion HTTP API). Off by default so the
# core builds/tests offline with the skeleton connector; turn on with
# `--features notion-http`. Shares the `reqwest` dependency with `llm-http`.
notion-http = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util"] }

# U4 (Interface & Persona): embedded loopback-only REST server for the persona API.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }

# Security (all pure-Rust — RustCrypto): password KDF + authenticated encryption.
argon2 = "0.5"
aes-gcm = "0.10"
# Digest for storage keys whose natural form (a filesystem path) is too long to
# survive base64 encoding into a filename.
sha2 = "0.10"
rand = "0.8"
zeroize = "1"
base64 = "0.22"

# Masking gateway (U1) + U2 deterministic masking-rule matching (offline, no network).
regex = "1"

# Real cloud LLM client (optional; feature `llm-http`).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# --- U2 INTEGRATION-TODO: external connectors / parsers ---------------------
# These are intentionally NOT enabled yet. The U2 connectors (Notion/Gmail) and
# heavy file parsers (PDF/DOCX) ship as contract-satisfying skeletons so the
# crate builds & tests offline. Uncomment + wire up during integration.
#   oauth2       = "4"          # OAuth2 token flow (credentials via U1 CredentialStore)
#   notify       = "6"          # filesystem watch for File connector (US-1.5)
#   pdf-extract  = "0.7"        # PDF body parsing (US-1.5)
#   docx-rs      = "0.4"        # DOCX body parsing (US-1.5)
# (Notion/Gmail HTTP via reqwest — already a dependency above under `llm-http`.)
# ---------------------------------------------------------------------------

[dev-dependencies]
# Property-based testing (PBT-09). proptest supports custom strategies,
# automatic shrinking, and seed-based reproducibility (.proptest-regressions).
proptest = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tempfile = "3"
# Examples are run by hand against a real vault and must honour the same
# `.env` the app reads — otherwise `CLAUDE_CLI_MODEL=claude-opus-5` is set,
# the collection runs on the default model, and nothing says so.
dotenvy = "0.15"
